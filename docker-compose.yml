version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: ayuda-solidaria-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ayuda
      POSTGRES_PASSWORD: ayuda_secret_2024
      POSTGRES_DB: ayuda_solidaria
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ayuda -d ayuda_solidaria']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ayuda-solidaria-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
